<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
        </tr>
    </thead>
    <tbody>
        @for (p of products; track p.id){
            <tr>
                <td>{{p.id}}</td>
                <td>{{p.name}}</td>
                <td>{{p.price}}</td>
                <td><img [src]="p.image" [alt]="p.name" width="100" height="100"></td>
            </tr>
        } @empty {
            <tr>
                <td colspan="3">No products available.</td>
            </tr>
            <tr *ngFor="let p of products; let i = index; let isOdd = odd" [class.bg-grey]="isOdd">
                <td>{{i + 1}}</td> <td>{{p.name}}</td>
            </tr>
        }


    </tbody>
</table>
